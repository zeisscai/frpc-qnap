# frpc-qnap QPKG 配置（QDK qpkg.cfg）
# 文档：https://github.com/qnap-dev/QDK

QPKG_NAME="frpc-qnap"
QPKG_DISPLAY_NAME="frpc"
QPKG_VER="1.0.1"
QPKG_AUTHOR="zeisscai"
QPKG_LICENSE="Apache-2.0"
QPKG_SUMMARY="FRP client with an integrated QTS management UI"

# 服务控制
QPKG_RC_NUM="150"
QPKG_SERVICE_PROGRAM="frpc-qnap.sh"
QPKG_SERVICE_PORT="7911"
QPKG_SERVICE_PIDFILE="frpc-qnap.pid"
QPKG_TIMEOUT="30,30"

# 网页端集成：QTS 反向代理 → 无需对外开放额外端口
QPKG_WEBUI="/frpc-qnap"
QPKG_WEB_PORT="7911"
QPKG_USE_PROXY="1"
QPKG_PROXY_PATH="/frpc-qnap"

# 在 QTS 桌面内以窗口打开（1=iFrame，0=新标签页，2=仅桌面）
QPKG_DESKTOP_APP="1"
QPKG_DESKTOP_APP_WIN_WIDTH="1100"
QPKG_DESKTOP_APP_WIN_HEIGHT="600"

# 0=仅管理员 1=管理员组（默认） 2=所有用户
QPKG_VISIBLE="1"

# 升级时保留的用户配置（相对安装目录）
#
# 注意路径约定（qbuild 2.5.3 的 add_config_data）：这里的相对路径要求默认文件
# 已经存在于数据包内的同一位置，否则 qbuild 直接 exit 1。所以默认文件放在
# shared/config/ 下（shared/ 会被整体同步进安装根目录），不要放 package/config/
# ——后者只对「安装根目录下的单层文件名」生效（QPKG_CONFIG="myApp.conf"）。
QPKG_CONFIG="config/manager.json config/state.json"

QTS_MINI_VERSION="4.4.0"
QPKG_VOLUME_SELECT="3"
